[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3loop"
version = "0.1.0"
description = "Asynchronous three-agent debate framework for code and mathematical problem solving."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Pillow is imported unconditionally by six modules (assistant_actions,
# bubble, documents, native_widget, prompt_window, screen_capture), and
# assistant_actions.py sits on server.py's own import chain - so this is not
# actually optional despite dependencies previously being declared empty.
# That gap only showed up building the Linux bundle: PyInstaller has nothing
# to detect for an import a venv never had installed, and the app crashed at
# startup with ModuleNotFoundError: No module named 'PIL'. Windows never hit
# it only because Pillow happened to already be present in that dev venv.
dependencies = ["pillow>=10.0"]
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
web = ["httpx>=0.27"]
desktop = [
  "pywebview>=5.0",
  "pillow>=10.0",
  "numpy>=1.24",
  "psutil>=5.9",
  "pypdf>=4.0",
]
# Windows-only native companion, OCR and speech integrations. Keep these out
# of the generic desktop extra so Linux/macOS can install the main window.
desktop-windows = [
  "winocr==0.0.15",
  "winrt-runtime==3.2.1",
  "winrt-Windows.Media.Ocr==3.2.1",
  "winrt-Windows.Media.SpeechRecognition==3.2.1",
]
# pytesseract is the Python bridge; Linux still needs the system Tesseract
# binary and language packs (tesseract-ocr, tesseract-ocr-fra, ...).
desktop-linux = [
  "pytesseract==0.3.13",
]
eye-tracking = [
  "opencv-contrib-python==5.0.0.93",
  "mediapipe==0.10.14",
]
llama = ["llama-cpp-python>=0.2.80"]
airllm = ["airllm>=2.0"]
litellm = ["litellm>=1.40"]
# reportlab is test-only: it generates the synthetic PDFs used to verify
# extract_text() actually reads a real PDF rather than assuming pypdf works.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "reportlab>=4.0"]

[project.scripts]
3loop = "three_loop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["three_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
