[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3loop"
version = "0.1.0"
description = "Asynchronous three-agent debate framework for code and mathematical problem solving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["httpx>=0.27"]
# Desktop app: pywebview renders the UI, Pillow/numpy draw the floating
# widget, psutil reports physical (not logical) core count for llama.cpp.
desktop = ["pywebview>=5.0", "pillow>=10.0", "numpy>=1.24", "psutil>=5.9"]
llama = ["llama-cpp-python>=0.2.80"]
airllm = ["airllm>=2.0"]
litellm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
3loop = "three_loop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["three_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
